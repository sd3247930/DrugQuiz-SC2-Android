<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a5fb4">
<meta name="csrf-token" content="">
<meta name="description" content="药品管理相关法规知识竞赛试题库（生产二部专用）——服务端版，支持顺序/随机/错题练习、解析与法条、统计与错题本。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a5fb4'/%3E%3Cpath d='M28 14h8v14h14v8H36v14h-8V36H14v-8h14z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<title>药品管理相关法规知识竞赛试题库（生产二部专用）</title>
</head>
<body>
<div class="app">
  <header class="app-header">
    <h1>药品管理相关法规知识竞赛试题库（生产二部专用）</h1>
    <div class="subtitle">生产二部 · 法规知识竞赛刷题 · 设置</div>
  </header>

  <nav class="nav">
    <a href="index.html" class="">首页</a>
    <a href="practice.html?mode=seq" class="">顺序练习</a>
    <a href="practice.html?mode=random" class="">随机练习</a>
    <a href="practice.html?mode=wrong" class="">错题练习</a>
    <a href="answer_card.html" class="">答题卡</a>
    <a href="settings.html" class="active">设置</a>
  </nav>

  
<div id="settings">
  <div class="stat-section">练习设置</div>

  <label class="field">
    <span class="field-label">背题模式（进入练习即显示答案与解析）</span>
    <input type="checkbox" id="setBackMode" >
  </label>

  <label class="field">
    <span class="field-label">夜间模式</span>
    <input type="checkbox" id="setDark" >
  </label>

  <label class="field">
    <span class="field-label">字号</span>
    <select id="setFont">
      <option value="normal" >标准</option>
      <option value="large" >大</option>
      <option value="xlarge" >特大</option>
    </select>
  </label>

  <label class="field">
    <span class="field-label">答对后自动下一题</span>
    <input type="checkbox" id="setAutoNext" >
  </label>

  <div class="btn-row">
    <button class="btn btn-primary" id="saveSettingsBtn" type="button">保存设置</button>
  </div>
  <div class="stat-section">题库管理</div>
  <div class="hint">
    App 内的题库是内置版本（当前 <span id="bankTotal">300</span> 题），随安装包一起分发，无需也无法重新导入。若要恢复到出厂状态，点下面的按钮。
  </div>
  <div class="btn-row">
    <button class="btn btn-danger" id="resetBankBtn" type="button">重置为内置题库（恢复出厂）</button>
  </div>

  <div class="stat-section">清空记录</div>
  <div class="hint">将清除全部作答进度、错题本与收藏，无法撤销。</div>
  <div class="btn-row">
    <button class="btn btn-danger" id="clearAllBtn" type="button">清空所有记录</button>
  </div>
</div>


  <footer class="footer">
    练习进度、错题本、收藏与笔记保存在本机（App 私有存储），不上传任何外部服务器。
  </footer>
</div>

<div class="toast" id="toast"></div>
<script src="data-offline.js"></script>
<script src="local-api.js"></script>
<script src="script.js"></script>

<script>window.PAGE = 'settings';</script>

<script src="page-init.js"></script>
</body>
</html>
