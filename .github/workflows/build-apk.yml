name: Build DrugQuiz APK

# 触发方式：手动触发（推荐）或推送到 main 分支
# 打 v* tag（如 v1.5.3）时额外发布 Release，产物固定名 DrugQuiz-SC2.apk，
# 供网页版永久直链：https://github.com/sd3247930/DrugQuiz-SC2-Android/releases/latest/download/DrugQuiz-SC2.apk
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

# 发布 Release 需要写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Capacitor 8 CLI 要求 Node >= 22
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # Capacitor 8 / AGP 生成工程要求 Java 21
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # 说明：不再使用 android-actions/setup-android@v3 —— 该动作会尝试安装已被官方移除的
      # `tools` 包，在较新的 runner 镜像上直接报错（Failed to find package 'tools'）。
      # GitHub 的 ubuntu-latest runner 已预装 Android SDK，这里只补装工程需要的组件。
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          fi
          echo "使用 sdkmanager：$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true
          ls "$ANDROID_HOME/platforms/"
          ls "$ANDROID_HOME/build-tools/"

      - name: Install dependencies
        run: npm install

      # 生成离线题库 + 拆分网页资源
      - name: Generate offline data & web assets
        run: |
          python generate_offline.py
          python build_www.py
          ls -lh www/

      - name: Capacitor sync
        run: npx cap sync android

      # 关键校验：防止题库丢失/资源未同步导致装出来的 App 是空壳
      - name: Verify bundled question bank
        run: |
          test -f android/app/src/main/assets/public/data-offline.js
          grep -q "window.__QUESTION_BANK__" android/app/src/main/assets/public/data-offline.js
          COUNT=$(grep -o '"type":"' android/app/src/main/assets/public/data-offline.js | wc -l)
          SINGLE=$(grep -o '"type":"单选"' android/app/src/main/assets/public/data-offline.js | wc -l)
          MULTI=$(grep -o '"type":"多选"' android/app/src/main/assets/public/data-offline.js | wc -l)
          echo "题库条数：$COUNT（单选 $SINGLE / 多选 $MULTI）"
          test "$COUNT" -ge 300 || { echo "❌ 题库题目数少于 300，疑似生成失败"; exit 1; }
          test "$SINGLE" -eq 190 || { echo "❌ 单选题数应为 190，实际 $SINGLE"; exit 1; }
          test "$MULTI" -eq 110 || { echo "❌ 多选题数应为 110，实际 $MULTI"; exit 1; }
          grep -q '"explanation":' android/app/src/main/assets/public/data-offline.js || { echo "❌ 缺少解析字段"; exit 1; }
          grep -q '"law":' android/app/src/main/assets/public/data-offline.js || { echo "❌ 缺少法条字段"; exit 1; }
          diff android/app/src/main/assets/public/index.html www/index.html >/dev/null || { echo "❌ index.html 与 www 不一致，需重新 cap sync"; exit 1; }
          # 页面结构：4 个页面 + 本地接口垫片 + 前端脚本（v1.1 起与服务端版对齐）
          for f in index.html practice.html answer_card.html settings.html \
                   local-api.js page-init.js script.js selection.js law.js lawtip.js sheet.js style.css; do
            test -f "android/app/src/main/assets/public/$f" || { echo "❌ 缺少资源：$f"; exit 1; }
          done
          diff android/app/src/main/assets/public/answer_card.html www/answer_card.html >/dev/null \
            || { echo "❌ answer_card.html 与 www 不一致，需重新 cap sync"; exit 1; }
          diff android/app/src/main/assets/public/local-api.js www/local-api.js >/dev/null \
            || { echo "❌ local-api.js 与 www 不一致，需重新 cap sync"; exit 1; }
          echo "✅ 离线题库与网页资源完整（4 页面 + 本地接口垫片）"

      # 防回归：Capacitor 脚手架默认把自适应图标背景层写成 #FFFFFF，
      # 一旦被重置，Android 8+ 的桌面图标四边会重新出现一圈白边。
      - name: Verify launcher icon has no white background
        run: |
          FILE=android/app/src/main/res/values/ic_launcher_background.xml
          # 只取 <color> 的实际值，别把注释里提到的 #FFFFFF 也算进来
          COLOR=$(grep -o '<color name="ic_launcher_background">[^<]*' "$FILE" | sed 's/.*>//')
          NORM=$(echo "$COLOR" | tr 'a-z' 'A-Z' | tr -d ' ')
          echo "自适应图标背景色：$COLOR"
          case "$NORM" in
            '#FFFFFF'|'#FFF'|'') echo "❌ 背景层为空或为白色（Capacitor 脚手架默认 #FFFFFF，会让图标四周出现白边）"; exit 1 ;;
          esac
          test "$NORM" = "#0F5B78" || { echo "❌ 背景层不是品牌色 #0F5B78（当前 $COLOR）"; exit 1; }
          echo "✅ 自适应图标背景层为品牌色 $COLOR（无白色）"

      # 防回归（v1.5.4 起的新策略）：状态栏图标颜色**只有一个来源** = capacitor.config.ts 的 SystemBars 配置。
      #   1) styles.xml 不许再硬编码 windowLightStatusBar（历史遗留：主题写一套、插件又改一套，白天会打架）；
      #   2) SystemBars.style 必须是 DARK（= 深色背景 → 浅色/白色图标），否则插件在白天会把图标改成深色，
      #      压在深青顶栏 #0F5B78 上看不清；
      #   3) 同步产物 assets/capacitor.config.json 必须带上这条配置（防止忘了 npx cap sync）。
      - name: Verify status bar icon policy (single source)
        run: |
          if grep -q 'windowLightStatusBar' android/app/src/main/res/values/styles.xml; then
            echo "❌ styles.xml 里仍在硬编码 windowLightStatusBar，图标颜色会有两个来源："
            grep -n 'windowLightStatusBar' android/app/src/main/res/values/styles.xml
            exit 1
          fi
          grep -q '"SystemBars"' capacitor.config.ts && grep -q '"DARK"' capacitor.config.ts \
            || { echo "❌ capacitor.config.ts 缺少 SystemBars.style = DARK（深色背景 → 浅色图标）"; exit 1; }
          grep -q '"SystemBars"' android/app/src/main/assets/capacitor.config.json \
            || { echo "❌ assets/capacitor.config.json 未同步 SystemBars 配置（需重新执行 npx cap sync android）"; exit 1; }
          echo "✅ 状态栏图标策略唯一来源 = SystemBars(style=DARK → 浅色图标)；styles.xml 无硬编码"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # 固定签名密钥：来自 Secrets，解成 android/app/release.keystore。
      # 没有它的话每次 CI 都会自建 debug keystore，签名一变用户就装不上新版（必须先卸载，进度丢失）。
      - name: Write signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 secret SIGNING_KEYSTORE_BASE64（见 android-signing/说明.md）"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          ls -l android/app/release.keystore

      - name: Build APK
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/android/app/release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cd ..

      # 校验：包名 / 版本 / 应用名 / 图标 / 签名证书指纹（指纹固定，才能覆盖升级）
      - name: Verify release APK
        run: |
          set -e
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -l "$APK"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          BADGING=$("$BT/aapt2" dump badging "$APK")
          echo "$BADGING" | head -5
          echo "$BADGING" | grep -q "package: name='com.drugquiz.sc2'" || { echo "::error::包名不对"; exit 1; }
          echo "$BADGING" | grep -q "application-label:'药品法规刷题'" || { echo "::error::应用名不对"; exit 1; }
          echo "$BADGING" | grep -q "application-icon-480" || { echo "::error::缺少图标"; exit 1; }
          echo "--- 签名证书（应与 android-signing/说明.md 记录一致） ---"
          "$BT/apksigner" verify --print-certs "$APK" | grep -i "SHA-256" | head -2

      - name: Prepare APK
        run: |
          set -e
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk "artifacts/DrugQuiz-SC2.apk"
          ls -lh "artifacts/DrugQuiz-SC2.apk"
          sha256sum "artifacts/DrugQuiz-SC2.apk" > "artifacts/DrugQuiz-SC2.apk.sha256"
          cat "artifacts/DrugQuiz-SC2.apk.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: DrugQuiz-APK
          path: |
            artifacts/DrugQuiz-SC2.apk
            artifacts/DrugQuiz-SC2.apk.sha256
          if-no-files-found: error

      # 打 tag 时发布 Release：固定名 DrugQuiz-SC2.apk 让网页直链永久有效
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/DrugQuiz-SC2.apk
            artifacts/DrugQuiz-SC2.apk.sha256
          generate_release_notes: true
