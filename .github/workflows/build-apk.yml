name: Build DrugQuiz APK

# 触发方式：手动触发（推荐）或推送到 main 分支
#
# 一次触发同时产出**两个**安装包（M6 方案甲）：
#   DrugQuiz-SC2.apk      药品法规刷题 —— 内置全部题库，默认药品法规；网页永久直链用这个文件名：
#                         https://github.com/sd3247930/DrugQuiz-SC2-Android/releases/latest/download/DrugQuiz-SC2.apk
#   DrugQuiz-RuanKao.apk  软考架构师刷题 —— 只内置软考题库（937 题），独立包名 com.drugquiz.ruankao、独立图标
#
# 两个包由 matrix 驱动同一套步骤生成：题库 id、包名、应用名、版本号、图标目录、验收断言全部来自 matrix，
# 不再有"某个包忘了改某处"的隐患。
#
# 打 v* tag（如 v1.6.0）时，两个包由独立的 release job 一起发布到 Release。
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

# 发布 Release 需要写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # 一个变体失败不影响另一个：两个包都要看到自己的结论
      fail-fast: false
      matrix:
        include:
          - variant: sc2
            apk: DrugQuiz-SC2.apk
            app_id: com.drugquiz.sc2
            app_name: 药品法规刷题
            version_code: "14"
            version_name: 1.6.0
            bank: 药品法规
            banks: "药品法规,软考-架构师"
            expect_banks: "药品法规,软考-架构师"
            branding: ""
            icon_color: "#0F5B78"
          - variant: ruankao
            apk: DrugQuiz-RuanKao.apk
            app_id: com.drugquiz.ruankao
            app_name: 软考架构师刷题
            version_code: "1"
            version_name: 1.0.0
            bank: 软考-架构师
            banks: "软考-架构师"
            expect_banks: "软考-架构师"
            branding: android/branding/ruankao
            icon_color: "#1A5FB4"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Capacitor 8 CLI 要求 Node >= 22
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # Capacitor 8 / AGP 生成工程要求 Java 21
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # 说明：不再使用 android-actions/setup-android@v3 —— 该动作会尝试安装已被官方移除的
      # `tools` 包，在较新的 runner 镜像上直接报错（Failed to find package 'tools'）。
      # GitHub 的 ubuntu-latest runner 已预装 Android SDK，这里只补装工程需要的组件。
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          fi
          echo "使用 sdkmanager：$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true
          ls "$ANDROID_HOME/platforms/"
          ls "$ANDROID_HOME/build-tools/"

      - name: Install dependencies
        run: npm install

      # 变体参数（必须在 cap sync 之前）：cap sync 会用 capacitor.config.ts 的 appId/appName
      # 重新生成 strings.xml，所以应用名要在这之前改好。
      - name: Apply variant config
        run: |
          python apply-variant.py \
            --app-id "${{ matrix.app_id }}" \
            --app-name "${{ matrix.app_name }}" \
            --version-code "${{ matrix.version_code }}" \
            --version-name "${{ matrix.version_name }}"

      # 生成离线题库 + 拆分网页资源（题库范围由变体决定）
      - name: Generate offline data & web assets
        run: |
          python generate_offline.py --bank "${{ matrix.bank }}" --include "${{ matrix.banks }}"
          python build_www.py
          ls -lh www/

      - name: Capacitor sync
        run: npx cap sync android

      # 图标资源 + strings.xml（必须在 cap sync 之后）
      #   1) 图标：覆盖到 res 下，避免被脚手架文件顶掉；
      #   2) strings.xml：**cap sync 不会按 capacitor.config.ts 重写它**（2026-09-25 CI 断言抓到），
      #      桌面应用名与深链 scheme 都取自这里，所以再写一遍（脚本幂等，无 branding 的变体也照样跑）。
      - name: Apply variant icons & strings
        run: |
          python apply-variant.py \
            --app-id "${{ matrix.app_id }}" \
            --app-name "${{ matrix.app_name }}" \
            --branding "${{ matrix.branding }}"

      # 关键校验：防止题库丢失/资源未同步/变体参数没生效导致装出来的 App 是空壳或装错包
      - name: Verify bundled question bank
        run: |
          test -f android/app/src/main/assets/public/data-offline.js
          grep -q "window.__QUESTION_BANK__" android/app/src/main/assets/public/data-offline.js
          grep -q "window.__QUESTION_BANKS__" android/app/src/main/assets/public/data-offline.js \
            || { echo "❌ 缺少多题库数据 window.__QUESTION_BANKS__"; exit 1; }
          grep -q "window.__BANK_INDEX__" android/app/src/main/assets/public/data-offline.js \
            || { echo "❌ 缺少题库清单 window.__BANK_INDEX__"; exit 1; }
          # 断言按**变体指定的题库 + 题库 meta.json** 动态校验（M3）
          DATA_DIR=data
          [ -f "$DATA_DIR/index.json" ] || DATA_DIR=../tools/data
          if [ ! -f "$DATA_DIR/index.json" ]; then
            echo "::error::找不到 $DATA_DIR/index.json（题库清单）"; exit 1
          fi
          DEFAULT_BANK="${{ matrix.bank }}"
          META="$DATA_DIR/banks/$DEFAULT_BANK.meta.json"
          [ -f "$META" ] || { echo "::error::缺少题库 meta：$META"; exit 1; }
          TOTAL=$(python3 -c "import json;print(json.load(open('$META'))['total'])")
          SINGLE=$(python3 -c "import json;print(json.load(open('$META'))['single'])")
          MULTI=$(python3 -c "import json;print(json.load(open('$META'))['multiple'])")
          echo "变体 ${{ matrix.variant }} ｜ 默认题库：$DEFAULT_BANK（期望 $TOTAL 题 = 单选 $SINGLE + 多选 $MULTI）"
          # 产物里的 __BANK_STATS__ 必须与 meta 一致
          grep -q "window.__BANK_STATS__ = {total: $TOTAL, single: $SINGLE, multi: $MULTI}" \
            android/app/src/main/assets/public/data-offline.js \
            || { echo "❌ __BANK_STATS__ 与 meta.json 不一致（期望 total:$TOTAL single:$SINGLE multi:$MULTI）"; \
                 grep -o "window.__BANK_STATS__ = {[^}]*}" android/app/src/main/assets/public/data-offline.js; exit 1; }
          # 内置**哪些**题库必须与变体声明一致（药品法规版=两个都带；软考版=只带软考）
          EXPECT_BANKS="${{ matrix.expect_banks }}"
          ACTUAL_BANKS=$(python3 -c "
          import io,re,json
          src=io.open('android/app/src/main/assets/public/data-offline.js',encoding='utf-8').read()
          m=re.search(r'window\.__QUESTION_BANKS__ = (\{.*?\});\n',src,re.S)
          banks=json.loads(m.group(1)) if m else {}
          print(','.join(sorted(banks.keys())))
          ")
          EXPECT_SORTED=$(python3 -c "print(','.join(sorted('$EXPECT_BANKS'.split(','))))")
          echo "内置题库：$ACTUAL_BANKS（期望 $EXPECT_SORTED）"
          test "$ACTUAL_BANKS" = "$EXPECT_SORTED" \
            || { echo "❌ 内置题库与变体声明不一致"; exit 1; }
          # 内置题库里必须真的有题目（防止空数组混过）
          EMBEDDED=$(python3 -c "
          import io,re,json
          src=io.open('android/app/src/main/assets/public/data-offline.js',encoding='utf-8').read()
          m=re.search(r'window\.__QUESTION_BANKS__ = (\{.*?\});\n',src,re.S)
          banks=json.loads(m.group(1)) if m else {}
          print(len(banks.get('$DEFAULT_BANK', [])))
          ")
          echo "默认题库内置题数：$EMBEDDED"
          test "$EMBEDDED" -eq "$TOTAL" || { echo "❌ 默认题库题数应为 $TOTAL，实际 $EMBEDDED"; exit 1; }
          grep -q '"explanation":' android/app/src/main/assets/public/data-offline.js || { echo "❌ 缺少解析字段"; exit 1; }
          diff android/app/src/main/assets/public/index.html www/index.html >/dev/null || { echo "❌ index.html 与 www 不一致，需重新 cap sync"; exit 1; }
          # 页面结构：4 个页面 + 本地接口垫片 + 前端脚本（v1.1 起与服务端版对齐）
          for f in index.html practice.html answer_card.html settings.html \
                   local-api.js page-init.js script.js selection.js law.js lawtip.js sheet.js style.css; do
            test -f "android/app/src/main/assets/public/$f" || { echo "❌ 缺少资源：$f"; exit 1; }
          done
          diff android/app/src/main/assets/public/answer_card.html www/answer_card.html >/dev/null \
            || { echo "❌ answer_card.html 与 www 不一致，需重新 cap sync"; exit 1; }
          diff android/app/src/main/assets/public/local-api.js www/local-api.js >/dev/null \
            || { echo "❌ local-api.js 与 www 不一致，需重新 cap sync"; exit 1; }
          echo "✅ 离线题库与网页资源完整（4 页面 + 本地接口垫片）"

      # 变体参数落地的证据：strings.xml 里的应用名/包名必须是本变体声明的值
      - name: Verify variant applied to android resources
        run: |
          STRINGS=android/app/src/main/res/values/strings.xml
          grep -q ">${{ matrix.app_name }}<" "$STRINGS" \
            || { echo "::error::strings.xml 的 app_name 不是 ${{ matrix.app_name }}（cap sync 前忘了改 capacitor.config.ts？）"; cat "$STRINGS"; exit 1; }
          grep -q ">${{ matrix.app_id }}<" "$STRINGS" \
            || { echo "::error::strings.xml 的 package_name 不是 ${{ matrix.app_id }}"; cat "$STRINGS"; exit 1; }
          grep -q 'applicationId "${{ matrix.app_id }}"' android/app/build.gradle \
            || { echo "::error::build.gradle 的 applicationId 不对"; exit 1; }
          grep -q 'versionName "${{ matrix.version_name }}"' android/app/build.gradle \
            || { echo "::error::build.gradle 的 versionName 不对"; exit 1; }
          echo "✅ 变体 ${{ matrix.variant }}：应用名 ${{ matrix.app_name }} ｜ 包名 ${{ matrix.app_id }} ｜ 版本 ${{ matrix.version_name }}"

      # 防回归：Capacitor 脚手架默认把自适应图标背景层写成 #FFFFFF，
      # 一旦被重置，Android 8+ 的桌面图标四边会重新出现一圈白边。
      - name: Verify launcher icon has no white background
        run: |
          FILE=android/app/src/main/res/values/ic_launcher_background.xml
          # 只取 <color> 的实际值，别把注释里提到的 #FFFFFF 也算进来
          COLOR=$(grep -o '<color name="ic_launcher_background">[^<]*' "$FILE" | sed 's/.*>//')
          NORM=$(echo "$COLOR" | tr 'a-z' 'A-Z' | tr -d ' ')
          EXPECT=$(echo "${{ matrix.icon_color }}" | tr 'a-z' 'A-Z' | tr -d ' ')
          echo "自适应图标背景色：$COLOR（变体期望 $EXPECT）"
          case "$NORM" in
            '#FFFFFF'|'#FFF'|'') echo "❌ 背景层为空或为白色（Capacitor 脚手架默认 #FFFFFF，会让图标四周出现白边）"; exit 1 ;;
          esac
          test "$NORM" = "$EXPECT" || { echo "❌ 背景层不是本变体的品牌色（当前 $COLOR，期望 $EXPECT）"; exit 1; }
          echo "✅ 自适应图标背景层为品牌色 $COLOR（无白色）"

      # 防回归（v1.5.4 起的新策略）：状态栏图标颜色**只有一个来源** = capacitor.config.ts 的 SystemBars 配置。
      #   1) styles.xml 不许再硬编码 windowLightStatusBar（历史遗留：主题写一套、插件又改一套，白天会打架）；
      #   2) SystemBars.style 必须是 DARK（= 深色背景 → 浅色/白色图标），否则插件在白天会把图标改成深色；
      #   3) 同步产物 assets/capacitor.config.json 必须带上这条配置（防止忘了 npx cap sync）。
      - name: Verify status bar icon policy (single source)
        run: |
          # 只匹配真正的 <item .../> 元素，注释里提到这个属性名不算（说明性注释允许存在）
          if grep -q '<item name="android:windowLightStatusBar"' android/app/src/main/res/values/styles.xml; then
            echo "❌ styles.xml 里仍在硬编码 windowLightStatusBar，图标颜色会有两个来源："
            grep -n '<item name="android:windowLightStatusBar"' android/app/src/main/res/values/styles.xml
            exit 1
          fi
          grep -q 'SystemBars' capacitor.config.ts && grep -q '"DARK"' capacitor.config.ts \
            || { echo "❌ capacitor.config.ts 缺少 SystemBars.style = DARK（深色背景 → 浅色图标）"; exit 1; }
          grep -q 'SystemBars' android/app/src/main/assets/capacitor.config.json \
            || { echo "❌ assets/capacitor.config.json 未同步 SystemBars 配置（需重新执行 npx cap sync android）"; exit 1; }
          echo "✅ 状态栏图标策略唯一来源 = SystemBars(style=DARK → 浅色图标)；styles.xml 无硬编码"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # 固定签名密钥：来自 Secrets，解成 android/app/release.keystore。
      # 没有它的话每次 CI 都会自建 debug keystore，签名一变用户就装不上新版（必须先卸载，进度丢失）。
      # 两个变体用同一把密钥：包名不同，安装时互不冲突；同一把签名让"同一台手机装两个包"没有歧义。
      - name: Write signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 secret SIGNING_KEYSTORE_BASE64（见 android-signing/说明.md）"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          ls -l android/app/release.keystore

      - name: Build APK
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/android/app/release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cd ..

      # 校验：包名 / 版本 / 应用名 / 图标 / 签名证书指纹（指纹固定，才能覆盖升级）
      - name: Verify release APK
        run: |
          set -e
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -l "$APK"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          BADGING=$("$BT/aapt2" dump badging "$APK")
          echo "$BADGING" | head -5
          echo "$BADGING" | grep -q "package: name='${{ matrix.app_id }}'" \
            || { echo "::error::包名不对（期望 ${{ matrix.app_id }}）"; exit 1; }
          # 应用名断言：**动态读 capacitor.config.ts 的 appName**，不写死。
          # 写死的话，用打包工具改名后第一次出包必红（审核发现的 A-3）。
          EXPECTED_NAME=$(python3 - <<'PY'
          import io, re, sys
          text = io.open("capacitor.config.ts", encoding="utf-8").read()
          m = re.search(r"appName\s*:\s*['\"]([^'\"]+)['\"]", text)
          # 直接写 UTF-8 字节（绕开 Windows 控制台默认的 GBK 编码）
          sys.stdout.buffer.write((m.group(1) if m else "").encode("utf-8"))
          PY
          )
          if [ -z "$EXPECTED_NAME" ]; then
            echo "::error::未能从 capacitor.config.ts 读到 appName（改名流程异常）"
            exit 1
          fi
          echo "期望应用名（读自 capacitor.config.ts）：$EXPECTED_NAME"
          echo "$BADGING" | grep -q "application-label:'${EXPECTED_NAME}'" \
            || { echo "::error::应用名不对（期望 ${EXPECTED_NAME}）"; exit 1; }
          echo "$BADGING" | grep -q "versionName='${{ matrix.version_name }}'" \
            || { echo "::error::versionName 不对（期望 ${{ matrix.version_name }}）"; exit 1; }
          echo "$BADGING" | grep -q "application-icon-480" || { echo "::error::缺少图标"; exit 1; }
          echo "--- 签名证书（应与 android-signing/说明.md 记录一致） ---"
          "$BT/apksigner" verify --print-certs "$APK" | grep -i "SHA-256" | head -2

      - name: Prepare APK
        run: |
          set -e
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk "artifacts/${{ matrix.apk }}"
          ls -lh "artifacts/${{ matrix.apk }}"
          sha256sum "artifacts/${{ matrix.apk }}" > "artifacts/${{ matrix.apk }}.sha256"
          cat "artifacts/${{ matrix.apk }}.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: DrugQuiz-APK-${{ matrix.variant }}
          path: |
            artifacts/${{ matrix.apk }}
            artifacts/${{ matrix.apk }}.sha256
          if-no-files-found: error

  # 打 tag 时发布 Release：两个包一起上，固定名 DrugQuiz-SC2.apk 让网页直链永久有效
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download both APK artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: ls -lh artifacts/
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/DrugQuiz-SC2.apk
            artifacts/DrugQuiz-SC2.apk.sha256
            artifacts/DrugQuiz-RuanKao.apk
            artifacts/DrugQuiz-RuanKao.apk.sha256
          generate_release_notes: true
