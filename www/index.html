<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a5fb4">
<meta name="description" content="药品管理相关法规知识竞赛试题库（生产二部专用）——本地刷题工具，支持顺序练习、随机练习、错题本与统计，进度保存在本机浏览器。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a5fb4'/%3E%3Cpath d='M28 14h8v14h14v8H36v14h-8V36H14v-8h14z' fill='%23fff'/%3E%3C/svg%3E">
<title>药品管理相关法规知识竞赛试题库（生产二部专用）</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- ============================================================
     HTML 区：四个页面（主菜单 / 答题 / 错题本 / 统计）
     同一时刻只显示其中一个，用 .hidden 控制
     ============================================================ -->
<div class="app">
  <h1>药品管理相关法规知识竞赛试题库（生产二部专用）</h1>
  <div class="subtitle">生产二部 · 法规知识竞赛刷题</div>

  <!-- 主菜单 -->
  <div id="menu">
    <div class="progress" id="menuProgress"></div>
    <div class="summary" id="menuSummary"></div>
    <button class="menu-btn" id="btnFull" onclick="startFullQuiz()">顺序做全部题目</button>
    <button class="menu-btn" onclick="startRandomQuiz()">随机练习（打乱题目顺序）</button>
    <button class="menu-btn" onclick="startWrongQuiz()">错题练习（只做错题）</button>
    <button class="menu-btn gray" onclick="showWrongBook()">查看错题本</button>
    <button class="menu-btn gray" onclick="showStats()">查看统计</button>
    <button class="menu-btn red" onclick="resetAll()">清空所有记录（重新开始）</button>
  </div>

  <!-- 答题页 -->
  <div id="quiz" class="hidden">
    <div class="progress" id="quizProgress"></div>
    <div class="q-head">
      <span class="type-tag" id="questionType"></span>
      <span class="q-no" id="questionNo"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="mode-row">
      <span class="mode-label">背题模式：直接显示答案与解析，不判题</span>
      <button class="switch" id="backModeBtn" onclick="toggleBackMode()">关</button>
    </div>
    <div id="options"></div>
    <div class="result hidden" id="resultBox"></div>
    <div class="explain hidden" id="explainBox">
      <div class="explain-section">
        <div class="explain-title">解析</div>
        <div class="explain-text" id="explainText"></div>
      </div>
      <div class="explain-section">
        <div class="explain-title" id="lawTitle">法条依据</div>
        <div class="explain-text" id="lawText"></div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-secondary" onclick="backToMenu()">返回菜单</button>
      <button class="btn-primary" id="submitBtn" onclick="submitAnswer()">提交答案</button>
      <button class="btn-primary hidden" id="nextBtn" onclick="nextQuestion()">下一题</button>
    </div>
  </div>

  <!-- 错题本 -->
  <div id="wrongBook" class="hidden">
    <div class="progress" id="wrongBookProgress"></div>
    <div id="wrongList"></div>
    <div class="btn-row">
      <button class="btn-secondary" onclick="backToMenu()">返回菜单</button>
      <button class="btn-primary" onclick="startWrongQuiz()">开始错题重练</button>
    </div>
    <div class="hint">提示：在错题练习中把这题答对，会自动移出错题本。</div>
  </div>

  <!-- 统计页 -->
  <div id="stats" class="hidden">
    <div id="statsContent"></div>
    <div class="btn-row">
      <button class="btn-secondary" onclick="backToMenu()">返回菜单</button>
    </div>
  </div>

  <div class="footer">
    练习进度、错题本、统计只保存在这台设备的浏览器里，不上传任何服务器。<br>
    换手机或清除浏览器数据后，记录会丢失。
  </div>
</div>

<!-- 轻提示条 -->
<div class="toast" id="toast"></div>
<script src="data-offline.js"></script>
<script src="app.js"></script>
</body>
</html>
