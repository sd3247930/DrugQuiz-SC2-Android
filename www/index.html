<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a5fb4">
<meta name="csrf-token" content="">
<meta name="description" content="药品管理相关法规知识竞赛试题库（生产二部专用）——服务端版，支持顺序/随机/错题练习、解析与法条、统计与错题本。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a5fb4'/%3E%3Cpath d='M28 14h8v14h14v8H36v14h-8V36H14v-8h14z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<title>药品管理相关法规知识竞赛试题库（生产二部专用）</title>
</head>
<body>
<div class="app">
  <!-- 顶部品牌栏（设计稿：深青底、白字、含部门标识） -->
  <header class="app-bar">
    <span class="app-bar-logo">
      <img src="logo-header.png" alt="">
    </span>
    <span class="app-bar-text">
      <span class="app-bar-title">药品法规刷题</span>
      <span class="app-bar-sub">Home</span>
    </span>
    <span class="app-bar-chip">生产二部</span>
  </header>

  <main class="app-main">
    
<div id="menu">
  <div class="progress" id="menuProgress">
    当前进度：已作答  题 / 共  题
  </div>
  <div class="summary" id="menuSummary">
    错题  题 · 最近一次正确率
    
    · 累计作答  次
  </div>

  <div class="stat-grid">
    <div class="stat-item"><div class="stat-label">题库总题数</div><div class="stat-value" id="statTotal"></div></div>
    <div class="stat-item"><div class="stat-label">已答题数</div><div class="stat-value" id="statAnswered"></div></div>
    <div class="stat-item"><div class="stat-label">最近一次正确率</div>
      <div class="stat-value" id="statAccuracy"></div></div>
    <div class="stat-item"><div class="stat-label">错题数</div><div class="stat-value" id="statWrong"></div></div>
    <div class="stat-item"><div class="stat-label">累计作答次数</div><div class="stat-value" id="statAttempts"></div></div>
    <div class="stat-item"><div class="stat-label">尚未作答</div><div class="stat-value" id="statUnanswered"></div></div>
  </div>

  <div class="stat-section">练习入口</div>
  <a class="menu-btn" href="practice.html?mode=seq">顺序做全部 <span id="entryTotal"></span> 题</a>
  <a class="menu-btn" href="practice.html?mode=random">随机练习（打乱题目顺序）</a>
  <a class="menu-btn" href="practice.html?mode=wrong">错题练习（只做错题）</a>
  <a class="menu-btn gray" href="answer_card.html">查看错题本 / 答题卡</a>
  <a class="menu-btn gray" href="settings.html">查看设置</a>
</div>


    <footer class="footer">
      练习进度、错题本、收藏与笔记保存在本机（App 私有存储），不上传任何外部服务器。
    </footer>
  </main>

  <!-- 底部导航（设计稿：4 个 tab，图标 + 文字） -->
  <nav class="tabbar">
    <a href="index.html" class="tab active">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 10v11h6v-6h6v6h6V10z"/></svg>
      <span>首页</span>
    </a>
    <a href="practice.html?mode=seq" class="tab ">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l5 5v13H6zM14 3v6h6"/></svg>
      <span>练习</span>
    </a>
    <a href="answer_card.html" class="tab ">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4zM4 10h16M10 4v16"/></svg>
      <span>答题卡</span>
    </a>
    <a href="settings.html" class="tab ">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7z M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 2.6 15a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 9.5 4.1a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21.4 11a2 2 0 1 1 0 4z"/></svg>
      <span>设置</span>
    </a>
  </nav>
</div>

<div class="toast" id="toast"></div>
<script src="data-offline.js"></script>
<script src="local-api.js"></script>
<script src="script.js"></script>

<script>window.PAGE = 'home';</script>

<script src="page-init.js"></script>
</body>
</html>
