<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f5b78">
<meta name="csrf-token" content="">
<meta name="description" content="药品管理相关法规知识竞赛试题库（生产二部专用）——服务端版，支持顺序/随机/错题练习、解析与法条、统计与错题本。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a5fb4'/%3E%3Cpath d='M28 14h8v14h14v8H36v14h-8V36H14v-8h14z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="theme-variant.css">
<title>药品管理相关法规知识竞赛试题库（生产二部专用）</title>
</head>
<body>
<div class="app">
  <!-- 顶部品牌栏（设计稿：深青底、白字、含部门标识） -->
  <header class="app-bar">
    <span class="app-bar-logo">
      <img src="logo-header.png" alt="">
    </span>
    <span class="app-bar-text">
      <span class="app-bar-title">药品法规刷题</span>
      <span class="app-bar-sub">Practice</span>
    </span>
    <span class="app-bar-chip">生产二部</span>
  </header>

  <main class="app-main">
    
<div id="quiz" data-mode="seq" data-back="0">
  <div class="progress" id="quizProgress">正在加载题目…</div>
  <div class="q-head">
    <span class="type-tag" id="questionType"></span>
    <span class="q-no" id="questionNo"></span>
  </div>
  <div class="question" id="questionText"></div>

  <div class="mode-row">
    <span class="mode-label">本题依据的法条</span>
    <button class="btn-lawtip" id="lawTipBtn" type="button">查看法条</button>
  </div>

  <div class="mode-row">
    <span class="mode-label">背题模式：直接显示答案与解析，不判题</span>
    <button class="switch" id="backModeBtn" type="button">关</button>
  </div>

  <div id="options"></div>
  <div class="result hidden" id="resultBox"></div>

  <div class="explain hidden" id="explainBox">
    <div class="explain-section">
      <div class="explain-title">解析</div>
      <div class="explain-text" id="explainText"></div>
      <div class="explain-hint" id="explainHint"></div>
    </div>
  </div>

  <!-- 我的笔记（E4）：写在解析下方，输入后自动保存，只存在本机 -->
  <div class="note-box">
    <div class="note-title">我的笔记</div>
    <textarea class="note-input" id="noteText" rows="3"
      placeholder="在这里写你自己的备注（例如错因、易混点）；离开输入框会自动保存，只存在本机。"></textarea>
    <div class="hint" id="noteStatus"></div>
  </div>

  <div class="btn-row">
    <button class="btn btn-secondary" id="prevBtn" type="button">上一题</button>
    <button class="btn btn-primary" id="submitBtn" type="button">提交答案</button>
    <button class="btn btn-primary hidden" id="nextBtn" type="button">下一题</button>
  </div>
  <div class="hint" id="emptyHint"></div>
</div>

<!-- 法条弹层（复用选题面板的全屏弹层样式） -->
<div class="sheet hidden" id="lawTipSheet">
  <div class="sheet-header">
    <span class="sheet-title" id="lawTipTitle">法条</span>
    <button class="sheet-close" id="lawTipClose" type="button">✕</button>
  </div>
  <div class="sheet-list" id="lawTipBody"></div>
</div>


    <footer class="footer">
      练习进度、错题本、收藏与笔记保存在本机（App 私有存储），不上传任何外部服务器。
    </footer>
  </main>

  <!-- 底部导航（设计稿：4 个 tab，图标 + 文字） -->
  <nav class="tabbar">
    <a href="index.html" class="tab ">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 10v11h6v-6h6v6h6V10z"/></svg>
      <span>首页</span>
    </a>
    <a href="practice.html?mode=seq" class="tab ">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l5 5v13H6zM14 3v6h6"/></svg>
      <span>练习</span>
    </a>
    <a href="answer_card.html" class="tab ">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4zM4 10h16M10 4v16"/></svg>
      <span>答题卡</span>
    </a>
    <a href="settings.html" class="tab ">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7z M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 2.6 15a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 9.5 4.1a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21.4 11a2 2 0 1 1 0 4z"/></svg>
      <span>设置</span>
    </a>
  </nav>
</div>

<div class="toast" id="toast"></div>
<script src="data-offline.js"></script>
<script src="local-api.js"></script>
<script src="script.js"></script>

<script>window.PAGE = 'practice';</script>
<script src="sheet.js"></script>
<script src="lawtip.js"></script>

<script src="page-init.js"></script>
<script src="bank-selector.js"></script>
</body>
</html>
