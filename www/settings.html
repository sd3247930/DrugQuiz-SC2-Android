<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a5fb4">
<meta name="csrf-token" content="">
<meta name="description" content="药品管理相关法规知识竞赛试题库（生产二部专用）——服务端版，支持顺序/随机/错题练习、解析与法条、统计与错题本。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a5fb4'/%3E%3Cpath d='M28 14h8v14h14v8H36v14h-8V36H14v-8h14z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<title>药品管理相关法规知识竞赛试题库（生产二部专用）</title>
</head>
<body>
<div class="app">
  <!-- 顶部品牌栏（设计稿：深青底、白字、含部门标识） -->
  <header class="app-bar">
    <span class="app-bar-logo">
      <img src="logo-header.png" alt="">
    </span>
    <span class="app-bar-text">
      <span class="app-bar-title">药品法规刷题</span>
      <span class="app-bar-sub">Settings</span>
    </span>
    <span class="app-bar-chip">生产二部</span>
  </header>

  <main class="app-main">
    
<div id="settings">
  <div class="stat-section">练习设置</div>

  <label class="field">
    <span class="field-label">背题模式（进入练习即显示答案与解析）</span>
    <input type="checkbox" id="setBackMode" >
  </label>

  <label class="field">
    <span class="field-label">夜间模式</span>
    <input type="checkbox" id="setDark" >
  </label>

  <label class="field">
    <span class="field-label">字号</span>
    <select id="setFont">
      <option value="normal" >标准</option>
      <option value="large" >大</option>
      <option value="xlarge" >特大</option>
    </select>
  </label>

  <label class="field">
    <span class="field-label">答对后自动下一题</span>
    <input type="checkbox" id="setAutoNext" >
  </label>

  <div class="btn-row">
    <button class="btn btn-primary" id="saveSettingsBtn" type="button">保存设置</button>
  </div>
  <div class="stat-section">题库管理</div>
  <div class="hint">
    App 内的题库是内置版本（当前 <span id="bankTotal">300</span> 题），随安装包一起分发，无需也无法重新导入。若要恢复到出厂状态，点下面的按钮。
  </div>
  <div class="btn-row">
    <button class="btn btn-danger" id="resetBankBtn" type="button">重置为内置题库（恢复出厂）</button>
  </div>

  <div class="stat-section">进度备份（导出 / 导入）</div>
  <div class="hint">导出会生成一个 JSON 文件（含作答进度与设置），可用于备份、换设备或换版本时迁移；导入时可以选择覆盖当前进度，或与当前进度合并。</div>
  <div class="btn-row">
    <button class="btn btn-secondary" id="exportProgressBtn" type="button">导出进度</button>
    <button class="btn btn-secondary" id="importProgressBtn" type="button">导入进度</button>
  </div>
  <input type="file" id="importProgressFile" accept="application/json,.json" class="hidden">
  <div class="hint" id="progressIOStatus"></div>

  <div class="stat-section">清空记录</div>
  <div class="hint">将清除全部作答进度、错题本与收藏，无法撤销。</div>
  <div class="btn-row">
    <button class="btn btn-danger" id="clearAllBtn" type="button">清空所有记录</button>
  </div>
</div>


    <footer class="footer">
      练习进度、错题本、收藏与笔记保存在本机（App 私有存储），不上传任何外部服务器。
    </footer>
  </main>

  <!-- 底部导航（设计稿：4 个 tab，图标 + 文字） -->
  <nav class="tabbar">
    <a href="index.html" class="tab ">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 10v11h6v-6h6v6h6V10z"/></svg>
      <span>首页</span>
    </a>
    <a href="practice.html?mode=seq" class="tab ">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l5 5v13H6zM14 3v6h6"/></svg>
      <span>练习</span>
    </a>
    <a href="answer_card.html" class="tab ">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4zM4 10h16M10 4v16"/></svg>
      <span>答题卡</span>
    </a>
    <a href="settings.html" class="tab active">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7z M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 2.6 15a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 9.5 4.1a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21.4 11a2 2 0 1 1 0 4z"/></svg>
      <span>设置</span>
    </a>
  </nav>
</div>

<div class="toast" id="toast"></div>
<script src="data-offline.js"></script>
<script src="local-api.js"></script>
<script src="script.js"></script>

<script>window.PAGE = 'settings';</script>

<script src="page-init.js"></script>
<script src="bank-selector.js"></script>
</body>
</html>
