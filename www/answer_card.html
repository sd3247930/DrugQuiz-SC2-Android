<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a5fb4">
<meta name="csrf-token" content="">
<meta name="description" content="药品管理相关法规知识竞赛试题库（生产二部专用）——服务端版，支持顺序/随机/错题练习、解析与法条、统计与错题本。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a5fb4'/%3E%3Cpath d='M28 14h8v14h14v8H36v14h-8V36H14v-8h14z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<title>药品管理相关法规知识竞赛试题库（生产二部专用）</title>
</head>
<body>
<div class="app">
  <!-- 顶部品牌栏（设计稿：深青底、白字、含部门标识） -->
  <header class="app-bar">
    <span class="app-bar-logo">
      <img src="logo-header.png" alt="">
    </span>
    <span class="app-bar-text">
      <span class="app-bar-title">药品法规刷题</span>
      <span class="app-bar-sub">Answer Card</span>
    </span>
    <span class="app-bar-chip">生产二部</span>
  </header>

  <main class="app-main">
    
<div id="wrongBook">
  <div class="stat-grid">
    <div class="stat-item"><div class="stat-label">已答题数</div><div class="stat-value" id="cardAnswered"></div></div>
    <div class="stat-item"><div class="stat-label">最近一次正确率</div>
      <div class="stat-value" id="cardAccuracy"></div></div>
    <div class="stat-item"><div class="stat-label">错题数</div><div class="stat-value" id="wrongTotal"></div></div>
    <div class="stat-item"><div class="stat-label">累计作答次数</div><div class="stat-value" id="cardAttempts"></div></div>
  </div>

  <!-- 答题卡题号矩阵（设计稿 04 页）：5 列移动端优先，点格子直接跳到该题 -->
  <div class="stat-section">答题卡矩阵（点击题号跳到该题）</div>
  <div class="matrix-legend">
    <span class="legend-item"><i class="legend-dot"></i>未答</span>
    <span class="legend-item"><i class="legend-dot dot-correct"></i>答对</span>
    <span class="legend-item"><i class="legend-dot dot-wrong"></i>答错</span>
    <span class="legend-item"><i class="legend-dot dot-collected"></i>★ 已收藏</span>
  </div>
  <div class="answer-matrix" id="answerMatrix" aria-label="题号矩阵"></div>
  <div class="hint" id="matrixHint">正在加载题号矩阵…</div>

  <div class="stat-section">错题本</div>
  <div class="progress" id="wrongBookProgress"></div>
  <div id="wrongList"></div>

  <div class="stat-section">自由选题（按题型 / 状态 / 关键词挑题练习）</div>
  <div class="btn-row">
    <button class="btn btn-primary" id="openSelectionBtn" type="button">选题练习</button>
  </div>

  <div class="stat-section">法条浏览（按法条查看条文，并直接练该法条下的题）</div>
  <div class="btn-row">
    <button class="btn btn-secondary" id="openLawBtn" type="button">浏览法条</button>
  </div>
  <div id="lawList" class="hidden"></div>

  <div class="btn-row">
    <a class="btn btn-secondary" href="index.html">返回首页</a>
    <a class="btn btn-primary" href="practice.html?mode=wrong">开始错题重练</a>
  </div>
  <div class="btn-row">
    <button class="btn btn-secondary" id="clearWrongBtn" type="button">清空错题本</button>
    <button class="btn btn-secondary" id="exportWrongBtn" type="button">导出错题</button>
  </div>
  <div class="hint">提示：在错题练习中把这题答对，会自动移出错题本。</div>
</div>

<!-- 选题面板：全屏弹层（D1） -->
<div class="sheet hidden" id="selectionPanel">
  <div class="sheet-header">
    <span class="sheet-title">选题练习</span>
    <button class="sheet-close" id="closeSelectionBtn" type="button">✕</button>
  </div>
  <div class="sheet-filters" id="selectionFilters"></div>
  <div class="sheet-list" id="selectionList"></div>
  <div class="sheet-footer">
    <span class="sheet-count" id="selectionCount">已选 0 题</span>
    <div class="sheet-actions">
      <button type="button" id="selAllBtn">全选筛选结果</button>
      <button type="button" id="selInvertBtn">反选</button>
      <button type="button" id="selClearBtn">清空</button>
      <button type="button" class="btn-primary" id="selStartBtn">开始练习</button>
    </div>
  </div>
</div>


    <footer class="footer">
      练习进度、错题本、收藏与笔记保存在本机（App 私有存储），不上传任何外部服务器。
    </footer>
  </main>

  <!-- 底部导航（设计稿：4 个 tab，图标 + 文字） -->
  <nav class="tabbar">
    <a href="index.html" class="tab ">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 10v11h6v-6h6v6h6V10z"/></svg>
      <span>首页</span>
    </a>
    <a href="practice.html?mode=seq" class="tab ">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l5 5v13H6zM14 3v6h6"/></svg>
      <span>练习</span>
    </a>
    <a href="answer_card.html" class="tab active">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4zM4 10h16M10 4v16"/></svg>
      <span>答题卡</span>
    </a>
    <a href="settings.html" class="tab ">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7z M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 2.6 15a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 9.5 4.1a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21.4 11a2 2 0 1 1 0 4z"/></svg>
      <span>设置</span>
    </a>
  </nav>
</div>

<div class="toast" id="toast"></div>
<script src="data-offline.js"></script>
<script src="local-api.js"></script>
<script src="script.js"></script>

<script>window.PAGE = 'card';</script>
<script src="sheet.js"></script>
<script src="selection.js"></script>
<script src="law.js"></script>

<script src="page-init.js"></script>
</body>
</html>
