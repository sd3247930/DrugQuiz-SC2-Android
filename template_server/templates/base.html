<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a5fb4">
<meta name="csrf-token" content="{{ csrf_token }}">
<meta name="description" content="药品管理相关法规知识竞赛试题库（生产二部专用）——服务端版，支持顺序/随机/错题练习、解析与法条、统计与错题本。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a5fb4'/%3E%3Cpath d='M28 14h8v14h14v8H36v14h-8V36H14v-8h14z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<title>{% block title %}药品管理相关法规知识竞赛试题库（生产二部专用）{% endblock %}</title>
</head>
<body>
<div class="app">
  <!-- 顶部品牌栏（设计稿：深青底、白字、含部门标识） -->
  <header class="app-bar">
    <span class="app-bar-logo">
      <img src="{{ url_for('static', filename='logo-header.png') }}" alt="">
    </span>
    <span class="app-bar-text">
      <span class="app-bar-title">药品法规刷题</span>
      <span class="app-bar-sub">{% block subtitle %}生产二部 · 法规知识竞赛{% endblock %}</span>
    </span>
    <span class="app-bar-chip">生产二部</span>
  </header>

  <main class="app-main">
    {% block content %}{% endblock %}

    <footer class="footer">
      练习进度与错题本保存在运行本服务的电脑上（<code>data/</code> 目录），不上传任何外部服务器。
    </footer>
  </main>

  <!-- 底部导航（设计稿：4 个 tab，图标 + 文字） -->
  <nav class="tabbar">
    <a href="{{ url_for('index') }}" class="tab {% if active == 'home' %}active{% endif %}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 10v11h6v-6h6v6h6V10z"/></svg>
      <span>首页</span>
    </a>
    <a href="{{ url_for('practice', mode='seq') }}" class="tab {% if active in ['seq','random','wrong'] %}active{% endif %}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l5 5v13H6zM14 3v6h6"/></svg>
      <span>练习</span>
    </a>
    <a href="{{ url_for('answer_card') }}" class="tab {% if active == 'card' %}active{% endif %}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4zM4 10h16M10 4v16"/></svg>
      <span>答题卡</span>
    </a>
    <a href="{{ url_for('settings_page') }}" class="tab {% if active == 'settings' %}active{% endif %}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7z M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 2.6 15a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 9.5 4.1a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21.4 11a2 2 0 1 1 0 4z"/></svg>
      <span>设置</span>
    </a>
  </nav>
</div>

<div class="toast" id="toast"></div>
<script src="{{ url_for('static', filename='script.js') }}"></script>
{% block script %}{% endblock %}
</body>
</html>
